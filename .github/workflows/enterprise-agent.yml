name: Enterprise Agent course
on:
  push:
    paths: ["phase08-enterprise-agent/**", ".github/workflows/enterprise-agent.yml"]
  pull_request:
    paths: ["phase08-enterprise-agent/**", ".github/workflows/enterprise-agent.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase08-enterprise-agent
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: support
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U support -d support"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: phase08-enterprise-agent/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Check SQLite migration and API
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m pytest -q
      - name: Check PostgreSQL migration and API
        env:
          DATABASE_URL: postgresql+psycopg://support:ci_only@127.0.0.1:5432/support
          TEST_DATABASE_URL: postgresql+psycopg://support:ci_only@127.0.0.1:5432/support
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m pytest -q
